<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-wrapper">
      <div class="section-badge">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Get in Touch</span>
      </div>

      <h2 class="contact-title">함께 미래를 혁신할 <br><span class="gradient-text">기회를 기다립니다</span></h2>
      <p class="contact-desc">
        Generative Diffusion, Low-Level Vision, Multimodal AI 연구 협력 및 산학 연계, 기술 논의에 대해 열려 있습니다.<br>
        연구 협업이나 기술 문의는 이메일 및 링크드인을 통해 언제든 편하게 연락해주세요.
      </p>

      <div class="contact-email-box">
        <i class="fa-regular fa-envelope" style="color: var(--accent-primary); font-size: 1.2rem;"></i>
        <span class="contact-email-text">{{ site.data.profile.email }}</span>
        <button id="copy-email-btn" class="copy-email-btn" data-email="{{ site.data.profile.email }}"
          aria-label="이메일 주소 복사">
          <i class="fa-regular fa-copy"></i>
          <span>복사</span>
        </button>
      </div>

      <div class="contact-social-links">
        <a href="mailto:{{ site.data.profile.email }}" class="btn btn-primary">
          <i class="fa-solid fa-envelope"></i>
          <span>이메일 문의</span>
        </a>
        <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          <i class="fa-brands fa-linkedin"></i>
          <span>LinkedIn</span>
        </a>
      </div>
    </div>
  </div>
</section>
