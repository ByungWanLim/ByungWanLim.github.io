<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-wrapper">
      <div class="section-badge">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Get in Touch</span>
      </div>

      <h2 class="contact-title">연구와 기술로 혁신에 기여할 <br><span class="gradient-text">새로운 도전을 준비하고 있습니다</span></h2>
      <p class="contact-desc">
        세상에 실질적인 가치를 더하는 AI 기술을 만들어가고 싶습니다.<br>
      </p>

      <div class="contact-email-box">
        <i class="fa-regular fa-envelope" style="color: var(--accent-primary); font-size: 1.2rem;"></i>
        <span class="contact-email-text">{{ site.data.profile.email }}</span>
        <button id="copy-email-btn" class="copy-email-btn" data-email="{{ site.data.profile.email }}"
          aria-label="이메일 주소 복사">
          <i class="fa-regular fa-copy"></i>
          <span>복사</span>
        </button>
      </div>

      <div class="contact-social-links">
        <a href="mailto:{{ site.data.profile.email }}" class="btn btn-primary">
          <i class="fa-solid fa-envelope"></i>
          <span>이메일</span>
        </a>
        <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          <i class="fa-brands fa-linkedin"></i>
          <span>LinkedIn</span>
        </a>
        {% if site.data.profile.phone %}
        <a href="tel:{{ site.data.profile.phone }}" class="btn btn-secondary">
          <i class="fa-solid fa-phone"></i>
          <span>전화</span>
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
