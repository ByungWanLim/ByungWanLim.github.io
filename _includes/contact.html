<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-wrapper">
      <div class="section-badge">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Get in Touch</span>
      </div>

      <h2 class="contact-title">함께 미래를 혁신할 <br><span class="gradient-text">기회를 기다립니다</span></h2>
      <p class="contact-desc">
        생성형 AI, 컴퓨터 비전(Low-Level Vision/Restoration), 멀티모달 딥러닝 연구 및 산업 적용에 대한 대화를 언제나 환영합니다.<br>
        연구 협력, 취업 포지션 제안, 기술 문의는 아래 이메일과 링크드인으로 편하게 연락주세요.
      </p>

      <div class="contact-email-box">
        <i class="fa-regular fa-envelope" style="color: var(--accent-primary); font-size: 1.2rem;"></i>
        <span class="contact-email-text">{{ site.data.profile.email }}</span>
        <button id="copy-email-btn" class="copy-email-btn" data-email="{{ site.data.profile.email }}" aria-label="이메일 주소 복사">
          <i class="fa-regular fa-copy"></i>
          <span>복사</span>
        </button>
      </div>

      <div class="contact-social-links">
        <a href="mailto:{{ site.data.profile.email }}" class="btn btn-primary">
          <i class="fa-solid fa-envelope"></i>
          <span>이메일 보내기</span>
        </a>
        <a href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          <i class="fa-brands fa-linkedin"></i>
          <span>LinkedIn</span>
        </a>
      </div>
    </div>
  </div>
</section>
